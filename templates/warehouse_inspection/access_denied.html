{% extends "base.html" %}
{% load static %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div style="text-align: center; max-width: 500px; padding: 40px;">
        <i class="fas fa-lock" style="font-size: 4em; color: #ef4444; margin-bottom: 20px;"></i>
        <h1 style="color: #1f2937; margin: 20px 0;">Access Denied</h1>
        <p style="color: #6b7280; font-size: 1.1em; margin: 20px 0;">
            You do not have permission to access this Warehouse Inspection area.
        </p>
        <a href="{% url 'landing_page' %}" 
           style="display: inline-block; background: #0076c8; color: white; padding: 12px 24px; 
                  border-radius: 8px; text-decoration: none; margin-top: 20px; font-weight: 600;">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
