{% comment %}
Shimmering placeholder cards for a grid that is about to be filled by JS.
Usage: {% include 'meritrack/_sk_cards.html' with count="1234" %}
{% endcomment %}
{% for _ in count|default:"123456" %}
<div class="mtd-session-card mt-sk-shell" aria-hidden="true">
    <div style="display:flex;justify-content:space-between;gap:8px;">
        <div class="mt-sk mt-sk-pill"></div>
        <div class="mt-sk mt-sk-pill" style="width:56px;"></div>
    </div>
    <div class="mt-sk mt-sk-title" style="width:66%;margin:12px 0 10px;"></div>
    <div class="mt-sk mt-sk-line"></div>
    <div class="mt-sk mt-sk-line"></div>
    <div class="mt-sk mt-sk-line"></div>
</div>
{% endfor %}
