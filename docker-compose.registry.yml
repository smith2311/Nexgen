
# Registry mode: deploy from the pre-built image in the GitLab registry — no
# local build, no source bind mount (the code comes from the image).
#
#   podman login registry-gitlab.e-meril.in
#   APP_TAG=v5 podman-compose -f docker-compose.registry.yml pull
#   APP_TAG=v5 podman-compose -f docker-compose.registry.yml up -d
#
# Its counterpart is docker-compose.yml, which builds from this checkout and
# bind-mounts the source for live editing. The two are MUTUALLY EXCLUSIVE at
# runtime — same compose project (nexgene-merilin), same container_name
# (django_app), and both use network_mode: host on port 8020. Only one can be
# up at a time; `down` from either file stops whichever is running.
#
# Keep the two in sync: `command:`, `volumes:`, and env config are duplicated
# between them on purpose, so a change here usually needs the same change there.
#
# A standalone file rather than an override, because an override cannot *remove*
# the `.:/app` mount from the base file — podman-compose only replaces a mount
# when the override declares the same container-side target.

services:
  db:
    image: postgres:16
    container_name: nexgen_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexgen}
      POSTGRES_USER: ${POSTGRES_USER:-nexgen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexgen@123}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: registry-gitlab.e-meril.in/nexgen-it/nexgen.e-meril.in/app:${APP_TAG:-v5.2.0}
    pull_policy: always
    container_name: django_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "7000:7000"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    command: >
      sh -c "python manage.py heal_squashed_migrations &&
             python manage.py migrate &&
             { [ -z \"$AI_AGENT_MYSQL_HOST\" ] || python manage.py migrate --database=ai_sales_agent_dashboard; } &&
             python manage.py seed_agents &&
             python manage.py collectstatic --noinput --clear &&
             exec daphne -b 0.0.0.0 -p 7000 -v 2 core.asgi:application"
    volumes:
      # Code comes from the image; only mutable state is mounted.
      - ./media:/app/media
      - ./logs:/app/logs
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: core.settings
      PYTHONUNBUFFERED: 1
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,gpt.e-meril.in}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}

volumes:
  static_volume:
  postgres_data:
