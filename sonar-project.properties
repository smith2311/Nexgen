sonar.projectKey=nexgen-it_nexgen.e-meril.in_0f59ea08-4551-4c8c-93e2-a759174af5c7
sonar.qualitygate.wait=true

sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Analyse the repository, minus everything that is not our code. Without these
# exclusions the scan is dominated by vendored libraries and generated output,
# which buries real findings and makes the quality gate meaningless.
sonar.sources=.

sonar.exclusions=\
  staticfiles/**,\
  static/admin/**,\
  static/rest_framework/**,\
  static/lib/**,\
  static/**/vendor/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/migrations/**,\
  media/**,\
  logs/**,\
  quality-reports/**,\
  **/__pycache__/**,\
  docs/**

# Tests are reported as tests rather than as duplicated production code.
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/tests/**,**/test_*.py,conftest.py

# Test files legitimately repeat setup and assertions; flagging that as
# duplication produces noise nobody acts on.
sonar.cpd.exclusions=**/tests.py,**/tests/**,**/test_*.py,**/migrations/**
